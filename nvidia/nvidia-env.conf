-------------------------------
---- NVIDIA ENV VARIABLES ----
-------------------------------

-- Wayland + NVIDIA compatibility env vars for Hyprland.
-- Linked to ~/.config/hypr/Modules/nvidia-env.conf by install.sh --nvidia
--
-- To activate, add this line to ~/.config/hypr/hyprland.lua:
--   require("Modules/nvidia-env")

hl.env("LIBVA_DRIVER_NAME",         "nvidia")
hl.env("GBM_BACKEND",               "nvidia-drm")
hl.env("__GLX_VENDOR_LIBRARY_NAME", "nvidia")
hl.env("NVD_BACKEND",               "direct")
hl.env("WLR_NO_HARDWARE_CURSORS",   "1")
